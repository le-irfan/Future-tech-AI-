<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Blog Post - FutureTechX</title><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><main class="auth-card"><a class="back-home" href="blog-ai.html">← Back to Blog</a><div id="create-post-app"></div></main><script>
const session = (() => { try { return JSON.parse(localStorage.getItem('futuretechx_session')); } catch { return null; } })();
const app = document.getElementById('create-post-app');
if (!session) {
  app.innerHTML = '<h1>🔐 Login required</h1><p class="subtitle">Please log in before creating a blog post.</p><div class="auth-links"><a href="login.html">Log in</a><a href="signup.html">Sign up</a></div>';
} else {
  app.innerHTML = '<h1>📝 Create Blog Post</h1><p class="subtitle">Welcome, '+String(session.name).replace(/[&<>"']/g, '')+'!</p><form class="auth-form" id="post-form"><label>Title</label><input id="post-title" required maxlength="120"><label>Content</label><textarea id="post-content" required maxlength="5000" style="min-height:180px;padding:13px;border-radius:11px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.15)"></textarea><button type="submit">Publish Post</button></form><p id="post-message" class="auth-message"></p>';
  document.getElementById('post-form').addEventListener('submit', e => { e.preventDefault(); document.getElementById('post-message').textContent = 'Post form is ready. Connect this to your server/database when you want public multi-device publishing.'; });
}
</script></body></html>
