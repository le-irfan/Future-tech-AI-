<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FutureTechX</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="back-home" href="blog-ai.html">← Back to Blog</a>

    <h1>Login</h1>
    <p class="subtitle">Log in to create posts and comments.</p>

    <form id="login-form" class="auth-form">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        autocomplete="email"
        placeholder="Enter your email"
        required
      >

      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button type="submit"> Log in</button>
    </form>

    <p id="auth-message" class="auth-message" aria-live="polite"></p>

    <div class="auth-links">
      <a href="signup.html"> Create an account</a>
      <a href="blog-ai.html">← Back to Blog</a>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
