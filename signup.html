<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up - FutureTechX</title><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><main class="auth-card"><a class="back-home" href="blog-ai.html">← Back to Blog</a><h1>Create account</h1><p class="subtitle">Sign up to create posts and join the discussion.</p><form id="signup-form" class="auth-form"><label for="signup-name">Name</label><input id="signup-name" type="text" maxlength="50" autocomplete="name" required><label for="signup-email">Email</label><input id="signup-email" type="email" autocomplete="email" required><label for="signup-password">Password</label><input id="signup-password" type="password" minlength="6" autocomplete="new-password" required><label for="signup-confirm">Confirm password</label><input id="signup-confirm" type="password" minlength="6" autocomplete="new-password" required><button type="submit">✨ Create Account</button></form><p id="auth-message" class="auth-message" aria-live="polite"></p><div class="auth-links"><a href="login.html">Already have an account? Log in</a><a href="blog-ai.html">Continue to blog</a></div></main><script src="auth.js"></script></body></html>
