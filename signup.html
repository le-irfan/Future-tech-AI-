<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - FutureTechX</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand" href="tech.html">Future<span>Tech</span>X</a>
      <p class="subtitle">Create an account and start commenting.</p>
      <form class="auth-form" action="/api/auth/signup" method="post">
        <label>Username<input name="username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" required></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
        <label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
        <button class="auth-btn" type="submit">Create Account</button>
        <div class="auth-status" aria-live="polite"></div>
      </form>
      <p class="auth-switch">Already have an account? <a id="loginLink" href="login.html">Log in</a></p>
      <a class="auth-back" href="tech.html#blog">← Back to FutureTechX</a>
    </section>
  </main>
  <script>
    const next = new URLSearchParams(location.search).get('next');
    if (next && next.startsWith('/') && !next.startsWith('//')) document.getElementById('loginLink').href = `login.html?next=${encodeURIComponent(next)}`;
  </script>
  <script src="auth.js"></script>
</body>
</html>
