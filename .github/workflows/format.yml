name: Format code

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix CSS syntax
        run: sed -i 's/box-shadow(/box-shadow:/g' tech.css

      - name: Format HTML, CSS, JS and JSON
        run: npx --yes prettier@3.6.2 --write "**/*.{html,css,js,json}" --ignore-path .gitignore

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Format project code"
          git push

# Trigger repository formatting
